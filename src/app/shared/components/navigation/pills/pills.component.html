<ul class="items">
  @for (pill of pills(); track pill; let i = $index) {
    <li
      class="item"
      [class.item--selected]="selectedPill === pill.label">
      <a
        (click)="togglePill(pill.label)"
        class="item__link"
        [class.item__link--selected]="selectedPill === pill.label || !selectedPill && i === 0">
        {{pill.label}}
      </a>
    </li>
  }
</ul>
