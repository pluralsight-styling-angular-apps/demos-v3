<ul class="items">
  @for (item of items(); track item; let i = $index) {
    <li
      class="item"
      [class]="activeIndex === i ? 'item--active' : 'item--inactive'">
      <a
        (click)="selectItem(i)"
        class="item__label"
        [class]="activeIndex === i ? 'item__label--active' : 'item__label--inactive'">
        <span class="item__label-text">
          {{item.title()}}
        </span>
      </a>
      @if (activeIndex === i) {
        <ng-template [ngTemplateOutlet]="item.template()"></ng-template>
      }
    </li>
  }
</ul>
